name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Fallback URL download ZIP project Flutter"
        required: false
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options: [debug, release]
      only_analyze:
        description: "Hanya analyze"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          ASSET_ID=""
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          [ -n "$TAG" ] || { echo "::error::tag kosong"; exit 1; }
          [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "release" ] || { echo "::error::build_type tidak valid"; exit 1; }
          if [ -z "$ZIP_URL" ]; then
            echo "::error::zip_url kosong"; exit 1
          fi
          echo "INPUT OK | zip_url=provided | tag=$TAG | type=$BUILD_TYPE"

      - name: Download ZIP project (FAST + authenticated)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          ASSET_ID=""
          ZIP_URL="${{ github.event.inputs.zip_url }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          rm -f project.zip

          download_asset() {
            local token="$1" id="$2"
            [ -n "$token" ] && [ -n "$id" ] || return 1
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 10 \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: DEFFA-BUILD" \
              "$API/releases/assets/$id" -o project.zip || return 1
            [ -s project.zip ] && unzip -tq project.zip >/dev/null 2>&1
          }

          # Legacy-compatible mode: bot dispatch sends zip_url.
          if false; then
            echo "Download release asset ID $ASSET_ID"
            download_asset "$GH_TOKEN" "$ASSET_ID" || \
            download_asset "$ACTIONS_TOKEN" "$ASSET_ID" || true
          fi

          # 2) If asset ID failed/stale, resolve the asset again from the release tag.
          if ! [ -s project.zip ] || ! unzip -tq project.zip >/dev/null 2>&1; then
            rm -f project.zip
            echo "Asset ID gagal/expired, resolve asset dari release tag: $TAG"
            for token in "$GH_TOKEN" "$ACTIONS_TOKEN"; do
              [ -n "$token" ] || continue
              RELEASE_JSON="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 \
                -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API/releases/tags/$TAG" 2>/dev/null || true)"
              FOUND_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '[.assets[]? | select(.name | endswith(".zip")) | .id][0] // empty')"
              if [ -n "$FOUND_ID" ] && download_asset "$token" "$FOUND_ID"; then
                ASSET_ID="$FOUND_ID"
                break
              fi
            done
          fi

          # 3) Legacy URL fallback, only if it really returns a ZIP.
          if ! [ -s project.zip ] || ! unzip -tq project.zip >/dev/null 2>&1; then
            rm -f project.zip
            if [ -n "$ZIP_URL" ]; then
              echo "Trying legacy zip_url fallback"
              for token in "$GH_TOKEN" "$ACTIONS_TOKEN" ""; do
                if [ -n "$token" ]; then
                  curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 10 \
                    -H "Authorization: Bearer $token" -H "Accept: application/octet-stream" \
                    "$ZIP_URL" -o project.zip 2>/dev/null || rm -f project.zip
                else
                  curl -fsSL --retry 5 --retry-all-errors --retry-delay 1 --connect-timeout 10 \
                    "$ZIP_URL" -o project.zip 2>/dev/null || rm -f project.zip
                fi
                [ -s project.zip ] && unzip -tq project.zip >/dev/null 2>&1 && break
                rm -f project.zip
              done
            fi
          fi

          # IMPORTANT: never send the old "Not Found" HTML/text into Extract ZIP.
          if ! [ -s project.zip ] || ! unzip -tq project.zip >/dev/null 2>&1; then
            echo "::error::GitHub tidak mengembalikan ZIP valid. Asset ID/tag/url tidak dapat diakses dengan token worker."
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Tag: $TAG"
            echo "Asset ID: ${ASSET_ID:-none}"
            exit 1
          fi

          echo "ZIP VALID: $(du -h project.zip | cut -f1)"

      - name: Extract ZIP
        run: |
          set -euo pipefail
          rm -rf project_raw
          mkdir -p project_raw
          unzip -oq project.zip -d project_raw

          SUB_DIR_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type d | wc -l)
          FILE_COUNT=$(find project_raw -maxdepth 1 -mindepth 1 -type f | wc -l)
          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw -maxdepth 1 -mindepth 1 -type d -print -quit)
          else
            PROJECT_DIR="project_raw"
          fi

          # Jangan mematikan build hanya karena struktur ZIP berbeda. Validasi
          # cukup berdasarkan pubspec.yaml; Flutter sendiri akan melaporkan
          # error project jika source memang tidak lengkap.
          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "::error::pubspec.yaml tidak ditemukan pada root project hasil extract: $PROJECT_DIR"
            echo "Top-level files:"
            find project_raw -maxdepth 2 -type f | head -80
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT ROOT: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Repair Android build environment (AUTO)
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          # Cari ndkVersion di seluruh konfigurasi Android, termasuk assignment
          # ext/variable yang umum pada project Flutter lama. Jika tidak ada,
          # pakai NDK yang stabil dan tersedia di runner.
          NDK_VERSION=""
          if [ -d "$PROJECT_DIR/android" ]; then
            NDK_VERSION="$(grep -RhoE "ndkVersion[[:space:]]*([=:][[:space:]]*)?['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" "$PROJECT_DIR/android" 2>/dev/null | head -n1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' || true)"
          fi
          if [ -z "$NDK_VERSION" ]; then
            for candidate in 28.2.13676358 27.2.12479018 27.0.12077973; do
              if [ -d "$SDK_ROOT/ndk/$candidate" ] && [ -f "$SDK_ROOT/ndk/$candidate/source.properties" ]; then
                NDK_VERSION="$candidate"
                break
              fi
            done
          fi
          NDK_VERSION="${NDK_VERSION:-28.2.13676358}"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            rm -rf "$NDK_DIR"
            "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi
          test -f "$NDK_DIR/source.properties"
          echo "ANDROID NDK $NDK_VERSION: READY"

          # Install Android platforms/build-tools requested explicitly by the
          # project when possible. Missing SDK packages are a common cause of
          # otherwise valid Flutter projects failing before Gradle compilation.
          COMPILE_SDK="$(grep -RhoE "compileSdk(Version)?[[:space:]]*([=:][[:space:]]*)?[0-9]+" "$PROJECT_DIR/android" 2>/dev/null | head -n1 | grep -Eo '[0-9]+' | tail -n1 || true)"
          if [ -n "$COMPILE_SDK" ]; then
            yes | "$SDKMANAGER" "platforms;android-$COMPILE_SDK" >/dev/null 2>&1 || true
          fi

          # Gradle wrapper executable bit can be lost when the project ZIP is
          # created on Android/Windows. Restore it before invoking Flutter.
          [ ! -f "$PROJECT_DIR/android/gradlew" ] || chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Adaptive Java compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VER="$(grep -Eo 'gradle-[0-9]+\.[0-9]+(?:\.[0-9]+)?-' "$WRAPPER" 2>/dev/null | head -n1 | sed -E 's/gradle-([0-9.]+)-/\1/' || true)"
          echo "Gradle wrapper detected: ${GRADLE_VER:-unknown}"
          # Gradle 7.6+ berjalan dengan Java 17. Project lama yang memakai Gradle
          # 7.5 atau lebih rendah lebih aman dengan Java 11. Runner GitHub biasanya
          # sudah menyediakan kedua JDK sehingga tidak perlu download ulang.
          if [ -n "$GRADLE_VER" ]; then
            MAJOR_MINOR="$(echo "$GRADLE_VER" | cut -d. -f1-2)"
            if [ "$(printf '%s\n' "$MAJOR_MINOR" '7.6' | sort -V | head -n1)" = "$MAJOR_MINOR" ] && [ "$MAJOR_MINOR" != "7.6" ]; then
              JAVA11="$(find /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/11* -maxdepth 2 -type d -name 'x64' -print -quit 2>/dev/null || true)"
              if [ -n "$JAVA11" ] && [ -x "$JAVA11/bin/java" ]; then
                echo "JAVA_HOME=$JAVA11" >> "$GITHUB_ENV"
                echo "PATH=$JAVA11/bin:$PATH" >> "$GITHUB_ENV"
                echo "Adaptive Java: 11"
              fi
            fi
          fi

      - name: Prepare project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          rm -rf build
          echo "PROJECT READY"

      - name: Cache Flutter/Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies (quiet)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          flutter config --no-analytics >/dev/null 2>&1 || true
          RC=1
          for attempt in 1 2 3; do
            flutter pub get > pub_get_report.txt 2>&1 && { RC=0; break; }
            echo "pub get attempt $attempt/3 gagal; retry..."
            sleep $((attempt * 2))
          done
          if [ "$RC" -ne 0 ]; then
            echo
            echo "BUILD FAILED"
            echo "Step: Dependencies"
            echo "============================"
            echo "Error utama:"
            grep -Eim 12 "error|failed|exception|version solving failed|because .* depends on" pub_get_report.txt || tail -n 20 pub_get_report.txt
            echo "============================"
            echo "Log lengkap: pub_get_report.txt"
            exit "$RC"
          fi
          echo "DEPENDENCIES: OK"

      - name: Fast build preflight
        if: ${{ github.event.inputs.only_analyze != 'true' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          echo "FAST PREFLIGHT: project structure OK (Flutter analyze dilewati agar build lebih cepat)"

      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: exit 0

      - name: Build APK (FAST ARM64 + AUTO RECOVERY)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          rm -f build_report.txt build_arm64.txt build_retry.txt
          echo "BUILD APK — FAST ARM64 + AUTO RECOVERY"
          echo "========================================"

          export GRADLE_OPTS="-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          export ORG_GRADLE_PROJECT_org.gradle.parallel=true

          # Jangan mengubah source Flutter. Hanya pulihkan permission/config
          # Android yang sering hilang saat ZIP dibuat di Windows/Android.
          mkdir -p android
          touch android/gradle.properties
          grep -q '^android.useAndroidX=' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.enableJetifier=' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties
          grep -q '^org.gradle.jvmargs=' android/gradle.properties || echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> android/gradle.properties
          chmod +x android/gradlew 2>/dev/null || true

          # Auto namespace untuk AGP baru.
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ] && ! grep -qE '^\s*namespace[ =]' "$APP_GRADLE"; then
            PKG="$(grep -RhoE "package=['\"][A-Za-z_][A-Za-z0-9_.]*['\"]" android/app/src/main/AndroidManifest.xml android/app/src/debug/AndroidManifest.xml android/app/src/profile/AndroidManifest.xml 2>/dev/null | head -n1 | sed -E "s/.*package=['\"]([^'\"]+)['\"].*/\1/" || true)"
            [ -n "$PKG" ] || PKG="$(grep -Eo "applicationId[[:space:]]+['\"][A-Za-z_][A-Za-z0-9_.]*['\"]" "$APP_GRADLE" 2>/dev/null | head -n1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/" || true)"
            if [ -n "$PKG" ]; then
              sed -i "/^[[:space:]]*android[[:space:]]*{/a\    namespace \"$PKG\"" "$APP_GRADLE"
              echo "AUTO-FIX namespace=$PKG"
            fi
          fi

          # Pastikan dependency sudah sinkron sebelum Gradle.
          flutter pub get > /tmp/deffa_pub_retry.txt 2>&1 || {
            echo "PUB GET FAILED — build dihentikan karena dependency memang belum resolve."
            tail -n 120 /tmp/deffa_pub_retry.txt
            exit 1
          }

          run_build() {
            local outfile="$1"
            flutter clean >/dev/null 2>&1 || true
            flutter pub get >/dev/null 2>&1 || return 1
            ./android/gradlew --stop >/dev/null 2>&1 || true
            flutter build apk --release --target-platform android-arm64 --no-pub > "$outfile" 2>&1
          }

          if run_build build_arm64.txt; then
            cat build_arm64.txt > build_report.txt
          else
            cat build_arm64.txt > build_report.txt
            echo ""
            echo "PRIMARY BUILD FAILED — APPLYING SAFE ENVIRONMENT RECOVERY"

            # 1. Missing Android SDK platform/build-tools.
            SDKMANAGER="$(command -v sdkmanager || true)"
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            COMPILE_SDK="$(grep -RhoE "compileSdk(Version)?[[:space:]]*([=:][[:space:]]*)?[0-9]+" android 2>/dev/null | head -n1 | grep -Eo '[0-9]+' | tail -n1 || true)"
            if [ -n "$SDKMANAGER" ] && [ -n "$COMPILE_SDK" ]; then
              yes | "$SDKMANAGER" "platforms;android-$COMPILE_SDK" >/dev/null 2>&1 || true
              yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null 2>&1 || true
            fi

            # 2. Missing NDK version: install the exact version requested by project.
            NDK_VERSION="$(grep -RhoE "ndkVersion[[:space:]]*([=:][[:space:]]*)?['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" android 2>/dev/null | head -n1 | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' || true)"
            if [ -n "$SDKMANAGER" ] && [ -n "$NDK_VERSION" ]; then
              yes | "$SDKMANAGER" "ndk;$NDK_VERSION" >/dev/null 2>&1 || true
            fi

            # 3. Old release signing config is a frequent failure when the ZIP
            # contains no keystore. For a build-only worker, use debug signing
            # only when the log explicitly proves the configured keystore is absent.
            if grep -Eqi "(keystore.*(not found|does not exist)|storeFile.*not found|validateReleaseSigning|signingConfig.*release)" build_report.txt && [ -f "$APP_GRADLE" ]; then
              cp "$APP_GRADLE" /tmp/build.gradle.before-signing-fix
              python3 - "$APP_GRADLE" <<'PY'
import re,sys
p=sys.argv[1]
s=open(p,encoding='utf-8').read()
# Only replace release signingConfig when a release signing block is present.
pat=r'(buildTypes\s*\{\s*release\s*\{)(.*?)(\n\s*\})'
m=re.search(pat,s,re.S)
if m and 'signingConfig' in m.group(2):
    body=re.sub(r'signingConfig\s+signingConfigs\.[A-Za-z0-9_]+','signingConfig signingConfigs.debug',m.group(2),count=1)
    s=s[:m.start(2)]+body+s[m.end(2):]
    open(p,'w',encoding='utf-8').write(s)
PY
              echo "AUTO-FIX: release signing -> debug because configured keystore is absent"
            fi

            if run_build build_retry.txt; then
              cat build_retry.txt >> build_report.txt
            else
              cat build_retry.txt >> build_report.txt
              echo ""
              echo "========================================"
              echo "BUILD FAILED — ACTUAL ROOT CAUSE BELOW"
              echo "========================================"
              grep -Ei "(FAILURE:|Execution failed for task|Could not resolve|Could not find|requires a higher|version solving failed|current Dart SDK|NDK|namespace|compileSdk|minSdk|Kotlin|Java|keystore|signing|Manifest merger|resource .* not found|AAPT2|error:)" build_report.txt | tail -n 100 || true
              echo ""
              echo "----- LAST 180 BUILD LOG LINES -----"
              tail -n 180 build_report.txt || true
              exit 1
            fi
          fi

          APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*arm64*.apk' -print -quit 2>/dev/null || true)"
          [ -n "$APK" ] || APK="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$APK" ]; then
            echo "BUILD selesai tetapi APK tidak ditemukan."
            find build -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/deffa-artifact
          cp "$APK" build/deffa-artifact/app-arm64-v8a-release.apk
          echo "BUILD OK: $(du -h build/deffa-artifact/app-arm64-v8a-release.apk | cut -f1)"

      # Artifact dipakai sebagai jalur keselamatan bila Release API mengalami
      # eventual-consistency/429 setelah build selesai. Compression 0 membuat
      # ZIP artifact hampir sama dengan ukuran APK sehingga upload/download cepat.
      - name: Upload APK fallback artifact (FAST, NO COMPRESSION)
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/deffa-artifact/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload APK directly to Release (FAST + VERIFY, BEST EFFORT)
        id: release_upload
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          GH_API: https://api.github.com
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK="build/deffa-artifact/app-arm64-v8a-release.apk"
          test -s "$APK"
          NAME="$(basename "$APK")"

          RELEASE_JSON="$(mktemp)"
          RELEASE_ID=""
          UPLOAD_URL=""
          for n in $(seq 1 10); do
            CODE=$(curl -sS -L -o "$RELEASE_JSON" -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" || true)
            if [ "$CODE" = "200" ]; then
              RELEASE_ID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("id", ""))' "$RELEASE_JSON")"
              UPLOAD_URL="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(str(d.get("upload_url", "")).split("{")[0])' "$RELEASE_JSON")"
              [ -n "$RELEASE_ID" ] && [ -n "$UPLOAD_URL" ] && break
            fi
            sleep 1
          done
          rm -f "$RELEASE_JSON"
          test -n "$RELEASE_ID" && test -n "$UPLOAD_URL"

          # Hapus asset dengan nama yang sama agar retry tidak menghasilkan HTTP 422.
          curl -sS -L -o /tmp/release_assets.json \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GH_API/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" || true
          EXISTING_ID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); n=sys.argv[2]; print(next((a.get("id","") for a in d if a.get("name")==n), ""))' /tmp/release_assets.json "$NAME" 2>/dev/null || true)"
          if [ -n "$EXISTING_ID" ]; then
            curl -sS -L -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API/repos/$GITHUB_REPOSITORY/releases/assets/$EXISTING_ID" >/dev/null || true
          fi

          UPLOADED_ID=""
          for attempt in 1 2 3; do
            echo "UPLOAD $NAME attempt $attempt/3"
            CODE=$(curl -sS -L -o /tmp/release_upload.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$APK" \
              "$UPLOAD_URL?name=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$NAME")" || true)
            if [ "$CODE" = "201" ] || [ "$CODE" = "200" ]; then
              UPLOADED_ID="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("id", ""))' /tmp/release_upload.json 2>/dev/null || true)"
              [ -n "$UPLOADED_ID" ] && break
            fi
            sleep $attempt
          done
          test -n "$UPLOADED_ID"

          # Verifikasi berdasarkan asset ID hasil upload, bukan sekadar jumlah asset.
          VERIFIED=0
          for n in $(seq 1 5); do
            curl -sS -L -o /tmp/release_verify.json \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GH_API/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" || true
            VERIFIED="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); ids={str(a.get("id")) for a in d.get("assets",[])}; print(1 if str(sys.argv[2]) in ids else 0)' /tmp/release_verify.json "$UPLOADED_ID" 2>/dev/null || echo 0)"
            if [ "$VERIFIED" = "1" ]; then break; fi
            sleep 1
          done
          if [ "$VERIFIED" != "1" ]; then
            echo "::error::APK upload API sukses tetapi asset ID $UPLOADED_ID belum terlihat pada release setelah 5 detik."
            cat /tmp/release_upload.json 2>/dev/null | head -c 1500 || true
            exit 1
          fi
          echo "DIRECT RELEASE APK VERIFIED: $NAME (asset=$UPLOADED_ID)"

      - name: Build output summary
        if: always()
        run: |
          echo "========================================"
          echo "DEFFA BUILD OUTPUT"
          echo "========================================"
          echo "APK: app-arm64-v8a-release.apk"
          echo "Release upload: best-effort"
          echo "Fallback artifact: enabled / compression=0"
          echo "========================================"
