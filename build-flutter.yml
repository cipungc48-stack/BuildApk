name: Build Flutter Full

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Menjalankan Testing (Jika gagal, build akan berhenti)
      - name: Run Tests
        run: flutter test

      # Build APK untuk testing manual
      - name: Build APK (Release)
        run: flutter build apk --release

      # Build AAB untuk Google Play Store
      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      # Upload APK agar bisa diunduh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Upload AAB agar bisa diunduh
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
